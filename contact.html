<div style="width:116px;height:4px;background:#ff5722;margin-bottom:24px"></div>
<p style="margin:0 0 40px;font-size:19px;color:#d9ccbb">Tell us a little about what you have in mind and we'll get back to you.</p>

<form action="https://formsubmit.co/horseandrabbet@gmail.com" method="POST" style="display:flex;flex-direction:column;gap:26px">
<input type="hidden" name="_subject" value="New custom work request from the Horse &amp; Rabbet website">
<input type="hidden" name="_template" value="table">
<input type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
<div><label for="cname" style="display:block;margin:0 0 8px;font-size:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#f2ece4">Name</label><input id="cname" name="name" type="text" required autocomplete="name" style="width:100%;padding:16px 18px;background:#f2ece4;border:0;font-family:inherit;font-size:17px;color:#19191b;box-sizing:border-box"></div>
<div><label for="cemail" style="display:block;margin:0 0 8px;font-size:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#f2ece4">Email</label><input id="cemail" name="email" type="email" required autocomplete="email" style="width:100%;padding:16px 18px;background:#f2ece4;border:0;font-family:inherit;font-size:17px;color:#19191b;box-sizing:border-box"></div>
<div><label for="cmsg" style="display:block;margin:0 0 8px;font-size:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#f2ece4">Tell us about your project</label><textarea id="cmsg" name="message" rows="7" required style="width:100%;padding:16px 18px;background:#f2ece4;border:0;font-family:inherit;font-size:17px;color:#19191b;box-sizing:border-box;min-height:200px;resize:vertical"></textarea></div>
<div><button type="submit" style="padding:16px 34px;background:#ff5722;color:#19191b;border:0;font-family:inherit;font-weight:600;font-size:15px;letter-spacing:.16em;text-transform:uppercase">Send request</button></div>
